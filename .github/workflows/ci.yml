name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: seat_booking
          MYSQL_USER: seat
          MYSQL_PASSWORD: seat
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql+aiomysql://seat:seat@127.0.0.1:3306/seat_booking?charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Migrate (real MySQL)
        run: alembic upgrade head

      - name: Test (with coverage gate)
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Django check
        working-directory: backoffice
        env:
          DB_NAME: seat_booking
          DB_USER: seat
          DB_PASSWORD: seat
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
        run: python manage.py check --database default