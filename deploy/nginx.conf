# SetBooking 反向代理样例（❌ 未在本机验证）
#
# 用法：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/setbooking
#   sudo ln -s /etc/nginx/sites-available/setbooking /etc/nginx/sites-enabled/setbooking
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前提：docker compose 用生产覆盖文件启动，8000/8001 只绑 127.0.0.1
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

upstream setbooking_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream setbooking_admin {
    server 127.0.0.1:8001;
    keepalive 8;
}

server {
    listen 80;
    server_name booking.example.com;   # ← 换成你的域名或服务器 IP

    client_max_body_size 8m;

    # ---------- FastAPI：业务 API ----------
    location /api/ {
        proxy_pass http://setbooking_api;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---------- FastAPI：文档与探活 ----------
    # 少了 /openapi.json 这条，Swagger 页面能打开但接口列表是空的
    location = /health        { proxy_pass http://setbooking_api/health; }
    location = /docs          { proxy_pass http://setbooking_api/docs; }
    location = /redoc         { proxy_pass http://setbooking_api/redoc; }
    location = /openapi.json  { proxy_pass http://setbooking_api/openapi.json; }

    # ---------- Django Admin ----------
    location /admin/ {
        proxy_pass http://setbooking_admin;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Django 静态文件（WhiteNoise 从容器里出）----------
    # 量大时可改成 Nginx 直接读镜像内的 staticfiles 目录，性能更好
    location /static/ {
        proxy_pass http://setbooking_admin;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # 首页跳 Swagger，方便演示
    location = / {
        return 302 /docs;
    }
}
